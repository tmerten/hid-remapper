name: build-nrf52-debug
on:
  push:
    branches: [diagnose-rgo-pairing]
    paths:
      - 'firmware/**'
      - 'firmware-bluetooth/**'
      - '.github/workflows/build-nrf52-debug.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Build XIAO SMP trace
        run: |
          docker run -v $PWD:/workdir/project -w /workdir/project/firmware-bluetooth nordicplayground/nrfconnect-sdk:v2.2-branch \
            sh -ec 'sdk_zephyr="${ZEPHYR_BASE:?Zephyr SDK path is missing}"; patch=/workdir/project/firmware-bluetooth/diagnostics/smp-opcodes.patch; git -C "$sdk_zephyr" apply --check "$patch"; git -C "$sdk_zephyr" apply "$patch"; west build -b seeed_xiao_nrf52840 -- -DEXTRA_CONF_FILE=/workdir/project/firmware-bluetooth/diagnostics/smp.conf'
          cp firmware-bluetooth/build/zephyr/remapper.uf2 firmware-bluetooth/remapper_seeed_xiao_nrf52840_debug.uf2
      - uses: actions/upload-artifact@v7
        with:
          name: artifact-seeed_xiao_nrf52840-debug
          path: firmware-bluetooth/remapper_seeed_xiao_nrf52840_debug.uf2
